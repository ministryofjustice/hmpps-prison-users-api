springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  datasource:
    url: 'jdbc:h2:mem:authorization-api-db;MODE=PostgreSQL'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    locations: classpath:db/prison-users

hmpps.sqs:
  provider: localstack
  localstackUrl: http://localhost:4566
  region: eu-west-2
  topics:
    domainevents:
      arn: arn:aws:sns:eu-west-2:000000000000:hmpps-domain-events
