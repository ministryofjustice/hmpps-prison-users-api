asyncapi: 3.0.0
info:
  title: HMPPS Prison Users API
  version: 1.0.0
  description: API to add / remove / change Prison Users

servers:
  development:
    host: "hmpps-domain-events-dev.live-1.cloud-platform.service.justice.gov.uk"
    protocol: sqs
    description: Development Environment
  preproduction:
    host: "hmpps-domain-events-preprod.live-1.cloud-platform.service.justice.gov.uk"
    protocol: sqs
    description: Pre-production Environment
  production:
    host: "hmpps-domain-events-prod.live-1.cloud-platform.service.justice.gov.uk"
    protocol: sqs
    description: Production Environment

components:
  messages:
    prison-users.user.account.unlocked:
      $ref: https://raw.githubusercontent.com/ministryofjustice/hmpps-domain-events/main/spec/schemas/prison-users/user-unlocked.yaml
    prison-users.user.name.updated:
      $ref: https://raw.githubusercontent.com/ministryofjustice/hmpps-domain-events/main/spec/schemas/prison-users/user-name-updated.yaml
    prison-users.user.email.updated:
      $ref: https://raw.githubusercontent.com/ministryofjustice/hmpps-domain-events/main/spec/schemas/prison-users/user-email-updated.yaml

channels:
  hmpps-domain-events:
    description: HMPPS domain events SNS topic
    bindings:
      sns:
        name: domainevents
    messages:
      prison-users.user.account.unlocked:
        $ref: '#/components/messages/prison-users.user.account.unlocked'
      prison-users.user.name.updated:
        $ref: '#/components/messages/prison-users.user.name.updated'
      prison-users.user.email.updated:
        $ref: '#/components/messages/prison-users.user.email.updated'

operations:
  publish-event:
    action: send
    channel:
      $ref: '#/channels/hmpps-domain-events'
    messages:
      - $ref: '#/channels/hmpps-domain-events/messages/prison-users.user.account.unlocked'
      - $ref: '#/channels/hmpps-domain-events/messages/prison-users.user.name.updated'
      - $ref: '#/channels/hmpps-domain-events/messages/prison-users.user.email.updated'
